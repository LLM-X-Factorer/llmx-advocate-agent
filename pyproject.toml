[project]
name = "llmx-advocate-agent"
version = "0.2.0"
description = "AI Engineering Advocate content production agent — turns research/PDFs/topics into Bilibili video scripts (Video JSON) with enforced quality gates."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "LE PPW" }]
requires-python = ">=3.12"
keywords = ["agent", "llm", "content-production", "bilibili", "anthropic", "openrouter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "anthropic>=0.39.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.3",
    "celery[redis]>=5.4.0",
    "redis>=5.1.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.29.0",
    "alembic>=1.13.3",
    "minio>=7.2.0",
    "click>=8.1.7",
    "rich>=13.9.0",
    "jinja2>=3.1.4",
    "jsonschema>=4.23.0",
    "python-ulid>=3.0.0",
    "structlog>=24.4.0",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "ipython>=8.28.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
]

[project.scripts]
llmx = "llmx_advocate.cli.main:cli"

[project.urls]
Homepage = "https://github.com/LLM-X-Factorer/llmx-advocate-agent"
Repository = "https://github.com/LLM-X-Factorer/llmx-advocate-agent"
Issues = "https://github.com/LLM-X-Factorer/llmx-advocate-agent/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmx_advocate"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "ASYNC", "SIM"]
# RUF001/002/003 flag fullwidth CJK punctuation that we use intentionally in 中文 strings.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]
# FastAPI Depends() in defaults is the canonical usage — B008 is a false positive here.
"src/llmx_advocate/api/routes/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
